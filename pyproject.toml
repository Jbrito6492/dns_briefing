[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-briefing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "duckdb>=1.1",
    "boto3>=1.34",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "moto[s3]>=5",
    "freezegun>=1.5",
]

[project.scripts]
dns-briefing = "dns_briefing.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["dns_briefing*"]
