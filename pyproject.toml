[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dns-briefing"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.32",
    "duckdb>=1.1",
    "boto3>=1.34",
    "markdown>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "responses>=0.25",
    "moto[s3]>=5",
    "freezegun>=1.5",
    "mypy>=1.10",
    "boto3-stubs[bedrock-runtime,s3]>=1.34",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[project.scripts]
dns-briefing = "dns_briefing.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["dns_briefing*"]

[dependency-groups]
dev = [
    "boto3-stubs>=1.43.6",
    "mypy>=2.0.0",
    "ruff>=0.15.12",
]
