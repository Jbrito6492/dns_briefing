server {
    listen 8765;

    # Edit this to match the local_dir value from your config.toml
    root /path/to/reports;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/dns-briefing.access.log;
    error_log  /var/log/nginx/dns-briefing.error.log;
}
